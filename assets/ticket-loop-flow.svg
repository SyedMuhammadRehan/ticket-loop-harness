<svg viewBox="0 0 900 400" width="900" height="400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8f88f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6b6fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="18" fill="#111219"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="18" fill="none" stroke="#26283340" stroke-width="1"/>

  <!-- header -->
  <text x="44" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#eceef3" letter-spacing="-0.5">ticket<tspan fill="#6b7180">-</tspan>loop</text>
  <text x="46" y="84" font-size="14.5" fill="#9aa0ad">Loop-engineering harness for Claude Code — ticket to a verified, reviewed branch.</text>

  <!-- connectors -->
  <g stroke="#3a3d49" stroke-width="2">
    <line x1="95"  y1="180" x2="150" y2="180"/>
    <line x1="190" y1="180" x2="245" y2="180"/>
    <line x1="285" y1="180" x2="340" y2="180"/>
    <line x1="380" y1="180" x2="435" y2="180"/>
    <line x1="475" y1="180" x2="530" y2="180"/>
    <line x1="570" y1="180" x2="625" y2="180"/>
    <line x1="665" y1="180" x2="720" y2="180"/>
  </g>
  <line x1="760" y1="180" x2="812" y2="180" stroke="#4ec99b" stroke-width="2" marker-end="url(#arw)"/>

  <!-- loop-back arc: Verify/QA fail -> Implement -->
  <path d="M690 202 C 690 268, 460 268, 460 202" fill="none" stroke="#6b6fe0" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arwd)"/>
  <text x="575" y="290" text-anchor="middle" font-size="12" fill="#8f88f2">fail → ledger → retry · 3 strikes → re-plan</text>

  <!-- nodes -->
  <g font-size="11.5" text-anchor="middle">
    <!-- 0 preflight -->
    <circle cx="72" cy="180" r="23" fill="#1b1d26" stroke="#8f88f2" stroke-width="2"/>
    <text x="72" y="185" fill="#c9cbf5" font-family="ui-monospace,monospace" font-size="13" font-weight="700">0</text>
    <text x="72" y="228" fill="#c4c8d2">Preflight</text>

    <!-- 1 intake gate -->
    <circle cx="167" cy="180" r="23" fill="#1b1d26" stroke="#e0a84e" stroke-width="2"/>
    <text x="167" y="185" fill="#e0a84e" font-family="ui-monospace,monospace" font-size="13" font-weight="700">1</text>
    <text x="167" y="228" fill="#c4c8d2">Intake</text>
    <text x="167" y="242" fill="#c08a3a" font-size="9.5">gate</text>

    <!-- 2 design gate -->
    <circle cx="262" cy="180" r="23" fill="#1b1d26" stroke="#e0a84e" stroke-width="2"/>
    <text x="262" y="185" fill="#e0a84e" font-family="ui-monospace,monospace" font-size="13" font-weight="700">2</text>
    <text x="262" y="228" fill="#c4c8d2">Design</text>
    <text x="262" y="242" fill="#c08a3a" font-size="9.5">gate</text>

    <!-- 3 freeze -->
    <circle cx="357" cy="180" r="23" fill="#1b1d26" stroke="#8f88f2" stroke-width="2"/>
    <text x="357" y="185" fill="#c9cbf5" font-family="ui-monospace,monospace" font-size="13" font-weight="700">3</text>
    <text x="357" y="228" fill="#c4c8d2">Freeze spec</text>
    <text x="357" y="242" fill="#7f84d6" font-size="9.5">locked</text>

    <!-- 4 implement gate -->
    <circle cx="452" cy="180" r="23" fill="#1b1d26" stroke="#e0a84e" stroke-width="2"/>
    <text x="452" y="185" fill="#e0a84e" font-family="ui-monospace,monospace" font-size="13" font-weight="700">4</text>
    <text x="452" y="228" fill="#c4c8d2">Implement</text>
    <text x="452" y="242" fill="#c08a3a" font-size="9.5">gate · TDD</text>

    <!-- 5 verify -->
    <circle cx="547" cy="180" r="23" fill="#1b1d26" stroke="#8f88f2" stroke-width="2"/>
    <text x="547" y="185" fill="#c9cbf5" font-family="ui-monospace,monospace" font-size="13" font-weight="700">5</text>
    <text x="547" y="228" fill="#c4c8d2">Verify</text>

    <!-- QA -->
    <circle cx="642" cy="180" r="23" fill="#1b1d26" stroke="#8f88f2" stroke-width="2"/>
    <text x="642" y="185" fill="#c9cbf5" font-family="ui-monospace,monospace" font-size="11" font-weight="700">QA</text>
    <text x="642" y="228" fill="#c4c8d2">Adversarial</text>
    <text x="642" y="242" fill="#7f84d6" font-size="9.5">independent</text>

    <!-- 7 report -->
    <circle cx="737" cy="180" r="23" fill="#16281f" stroke="#4ec99b" stroke-width="2"/>
    <text x="737" y="186" fill="#4ec99b" font-size="15">✓</text>
    <text x="737" y="228" fill="#c4c8d2">Report</text>

    <!-- branch out -->
    <text x="852" y="177" fill="#7f8794" font-size="11">branch</text>
    <text x="852" y="191" fill="#7f8794" font-size="11">+ report</text>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#9aa0ad">
    <rect x="44" y="336" width="12" height="12" rx="3" fill="#e0a84e"/>
    <text x="62" y="346">Gate — pauses for a human</text>
    <rect x="255" y="336" width="12" height="12" rx="3" fill="#8f88f2"/>
    <text x="273" y="346">Loop — retry / re-plan</text>
    <rect x="430" y="336" width="12" height="12" rx="3" fill="#4ec99b"/>
    <text x="448" y="346">Output — reviewed branch</text>
    <text x="632" y="346" fill="#6b7180">never pushes · never merges</text>
  </g>
</svg>
